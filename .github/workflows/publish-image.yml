# The release exporter places this at .github/workflows/publish-image.yml.
# This workflow is manual-only and refuses private repositories to avoid paid CI.
name: Publish reviewed media worker
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: media-worker-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline isolation and validation tests
        run: python3 -m unittest discover -s tests -v
      - name: Reclaim unused SDKs on this disposable GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          free_bytes=$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')
          test "$free_bytes" -ge 32212254720 || { echo 'At least 30 GiB free build space is required; no paid runner fallback.'; exit 1; }
      - name: Select immutable image tag
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          printf 'name=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'tag=%s:sha-%s\n' "$image" "$REVISION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish dependencies and reviewed handler
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=min
          sbom: true
      - name: Record immutable deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Deploy this immutable image: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'GHCR packages start private. Verify public anonymous pull or configure a durable read-only registry credential before Runpod deployment.\n' >> "$GITHUB_STEP_SUMMARY"
